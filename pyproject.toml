[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomech-logml"
version = "0.2.0"
description = "Machine learning for rock strength & elastic properties from standard wireline logs (Agbada Formation, Niger Delta)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GeoMech-LogML Team" }]
keywords = ["geomechanics", "petrophysics", "machine-learning", "well-logs", "SHAP"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lasio>=0.31",
    "shap>=0.45",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
    "pyarrow>=15.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
include = ["geomech_logml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
